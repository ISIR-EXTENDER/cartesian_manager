controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    qontrol_explorer:
      type: qontrol_controller/QontrolVelocityController
      auto_start: false

    gripper_controller:
      type: forward_command_controller/ForwardCommandController
      auto_start: false

    explorer_custom_controller:
      type: explorer_command_controllers/CustomController

gripper_controller:
  ros__parameters:
    joints:
      - right_finger_joint
    interface_name: position

qontrol_explorer:
  ros__parameters:
    robot_description_origin: robot_state_publisher
    tip_frame: ft_frame
    root_frame: base_link
    state_interface:
      - position
      - velocity
      - effort
    robot_command: qp_position
    chainable_controller_name: explorer_custom_controller
    reference_interface_name: velocity

    command_max_linear_velocity: 0.1
    topic_max_linear_velocity: /explorer_user_interfaces/rqt_armcontrol/max_linear_speed
    command_max_angular_velocity: 0.4
    topic_max_angular_velocity: /explorer_user_interfaces/rqt_armcontrol/max_angular_speed
    input_topic_name: /cartesian_command
    regularisation_weight: 1e-4
    topic_control_frame: /explorer_user_interfaces/rqt_armcontrol/control_frame_selection
    joint_target_topic_name: /joint_target_command
    joint_target_gain: 5.0
    joint_target_max_velocity: 0.8
    joint_target_tolerance: 1e-4
    joint_target_task_weight: 100.0

cartesian_manager:
  ros__parameters:
    update_rate_hz: 100.0

    frames:
      output_frame_id: base_link
      default_input_frame_id: base_link
      base_frame: base_link
      ee_frame: effector_frame
      hybrid_frame: hybrid_frame

    topics:
      joystick_command: /joystick_cartesian_command
      tablet_command: /tablet_cartesian_command
      visual_servoing_command: /visual_servoing_cartesian_command
      mode_request: /mode_request
      pose_target: /pose_target
      ee_pose: /ee_pose
      ee_vel: /ee_velocity
      ee_jac: /ee_jac
      joint_states: /joint_states
      joint_target_command: /joint_target_command
      output_command: /cartesian_command

    inputs:
      sources:
        - joystick
        - tablet
      joystick:
        timeout_sec: 0.2
        enabled: true
      tablet:
        timeout_sec: 0.2
        enabled: true
      visual_servoing:
        timeout_sec: 0.2
        enabled: true

    shapers:
      jaco:
        min_radius: 0.05
        max_angular_velocity: 0.4
      snake:
        gain: 3.0

    rate_limiter:
      max_linear_acceleration: 4.0
      max_angular_acceleration: 4.0

    behaviours:
      joint_targets:
        joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
        target_names: [home]
        positions: [2.5, 0.3, -2.4, 2.97, 1.2, -0.5]
      pose_targets:
        target_names: [ready]
        frame_ids: [base_link]
        positions: [0.6, 0.27, 0.22]
        orientations: [-0.22, 0.85, 0.11, 0.45]
        linear_kp: 5.0
        angular_kp: 1.0
        max_linear_velocity: 0.5
        max_angular_velocity: 0.2
        position_tolerance: 0.01
        orientation_tolerance: 0.05

explorer_custom_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    settings:
      joint_1: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 3.0, #1.0
        impedance_stiffness: 8.0, # 2.0
        enable_limits: false,
        position_command_min: -0.2,
        position_command_max:  0.2,
        position_step_max: 0.0005,
        # ref_mult: 0.01,
      }
      joint_2: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 4.0, #1.5
        impedance_stiffness: 8.0, #2.5
        enable_limits: false,
        position_command_min: -1.57,
        position_command_max: -0.78,
        position_step_max: 0.0005,
        # ref_mult: 0.01,
      }
      joint_3: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 3.0, #1.0
        impedance_stiffness: 8.0, #2.0
        enable_limits: false,
        position_command_min: -0.78,
        position_command_max:  0.78,
        position_step_max: 0.0005,
        # ref_mult: 0.01,
      }
      joint_4: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 2.0, #0.5
        impedance_stiffness: 4.0, #1.0
        enable_limits: false,
        position_command_min: -1.0,
        position_command_max:  1.0,
        position_step_max: 0.2,
        # position_command_init_value: 0.0,
        # ref_mult: 50.0,
      }
      joint_5: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 2.0, # 0.7
        impedance_stiffness: 4.0, #0.8
        enable_limits: false,
        position_command_min: -1.0,
        position_command_max:  1.0,
        position_step_max: 0.2,
        # position_command_init_value: 0.0,
        # ref_mult: 50.0,
      }
      joint_6: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 0.8,
        impedance_stiffness: 1.2,
        enable_limits: false,
        position_command_min: -1.0,
        position_command_max:  1.0,
        position_step_max: 0.5,
        # position_command_init_value: 0.0,
        # ref_mult: 50.0,
      }
