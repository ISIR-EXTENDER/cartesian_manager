controller_manager:
  ros__parameters:
    update_rate: 200

    qontrol_explorer:
      type: qontrol_controller/QontrolVelocityController
      auto_start: false

    gripper_controller:
      type: forward_command_controller/ForwardCommandController
      auto_start: false

gripper_controller:
  ros__parameters:
    joints:
      - right_finger_joint
    interface_name: position

qontrol_explorer:
  ros__parameters:
    robot_description_origin: robot_state_publisher
    tip_frame: ft_frame
    root_frame: base_link
    state_interface:
      - position
      - velocity
      - effort
    robot_command: position

    command_max_linear_velocity: 0.1
    topic_max_linear_velocity: /explorer_user_interfaces/rqt_armcontrol/max_linear_speed
    command_max_angular_velocity: 0.2
    topic_max_angular_velocity: /explorer_user_interfaces/rqt_armcontrol/max_angular_speed
    input_topic_name: /cartesian_command
    regularisation_weight: 1e-4
    topic_control_frame: /explorer_user_interfaces/rqt_armcontrol/control_frame_selection
    joint_target_topic_name: /joint_target_command
    joint_target_gain: 1.0
    joint_target_max_velocity: 0.2
    joint_target_tolerance: 0.05
    joint_target_task_weight: 1.0

cartesian_manager:
  ros__parameters:
    update_rate_hz: 100.0

    frames:
      output_frame_id: base_link
      default_input_frame_id: base_link
      base_frame: base_link
      ee_frame: effector_frame
      hybrid_frame: hybrid_frame

    topics:
      joystick_command: /joystick_cartesian_command
      tablet_command: /tablet_cartesian_command
      visual_servoing_command: /visual_servoing_cartesian_command
      mode_request: /mode_request
      pose_target: /pose_target
      ee_pose: /ee_pose
      ee_vel: /ee_velocity
      ee_jac: /ee_jac
      joint_states: /joint_states
      joint_target_command: /joint_target_command
      output_command: /cartesian_command

    inputs:
      sources:
        - joystick
        - tablet
      joystick:
        timeout_sec: 0.2
        enabled: true
      tablet:
        timeout_sec: 0.2
        enabled: true
      visual_servoing:
        timeout_sec: 0.2
        enabled: true

    shapers:
      jaco:
        min_radius: 0.05
        max_angular_velocity: 0.4
      snake:
        gain: 3.0

    rate_limiter:
      max_linear_acceleration: 2.0
      max_angular_acceleration: 1.0

    behaviours:
      joint_targets:
        joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
        target_names: [home]
        positions: [2.5, 0.3, -2.4, 2.97, 1.2, -0.5]
      pose_targets:
        target_names: [ready]
        frame_ids: [base_link]
        positions: [0.6, 0.27, 0.22]
        orientations: [-0.22, 0.85, 0.11, 0.45]
        linear_kp: 5.0
        angular_kp: 1.0
        max_linear_velocity: 0.5
        max_angular_velocity: 0.2
        position_tolerance: 0.01
        orientation_tolerance: 0.05
