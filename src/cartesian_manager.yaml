cartesian_manager:
  update_rate_hz:
    type: double
    default_value: 100.0
    read_only: true
    description: "Command manager update loop frequency in Hz. Must be > 0 and <= 1000."

  frames:
    output_frame_id:
      type: string
      default_value: "base_link"
      read_only: true
      description: "Frame id used on the published Cartesian command."
    default_input_frame_id:
      type: string
      default_value: "base_link"
      read_only: true
      description: "Frame used when an incoming TwistStamped header.frame_id is empty."
    base_frame:
      type: string
      default_value: "base_link"
      read_only: true
      description: "Base command frame. Inputs in this frame are summed without rotation."
    ee_frame:
      type: string
      default_value: "ft_frame"
      read_only: true
      description: "End-effector command frame. Inputs in this frame are rotated into base with ee_pose."
    hybrid_frame:
      type: string
      default_value: "hybrid_frame"
      read_only: true
      description: "Hybrid command frame. Inputs in this frame are rotated into base with the manager-computed hybrid pose."

  topics:
    joystick_command:
      type: string
      default_value: "/joystick_cartesian_command"
      read_only: true
      description: "Topic carrying joystick Cartesian commands."
    tablet_command:
      type: string
      default_value: "/tablet_cartesian_command"
      read_only: true
      description: "Topic carrying tablet Cartesian commands."
    visual_servoing_command:
      type: string
      default_value: "/visual_servoing_cartesian_command"
      read_only: true
      description: "Topic carrying visual-servoing Cartesian commands."
    mode_request:
      type: string
      default_value: "/mode_request"
      read_only: true
      description: "Topic carrying structured mode requests, such as geometric/snake or behaviour/joint_target/home."
    pose_target:
      type: string
      default_value: "/pose_target"
      read_only: true
      description: "Topic carrying a dynamic Cartesian pose target to execute immediately."
    ee_pose:
      type: string
      default_value: "/ee_pose"
      read_only: true
      description: "Topic carrying current end-effector pose."
    ee_vel:
      type: string
      default_value: "/ee_velocity"
      read_only: true
      description: "Topic carrying current end-effector velocity."
    ee_jac:
      type: string
      default_value: "/ee_jac"
      read_only: true
      description: "Topic carrying current end-effector Jacobian as a Float64MultiArray."
    joint_states:
      type: string
      default_value: "/joint_states"
      read_only: true
      description: "Topic carrying current joint positions."
    joint_target_command:
      type: string
      default_value: "/joint_target_command"
      read_only: true
      description: "Topic carrying named joint-position targets for the downstream QP controller."
    output_command:
      type: string
      default_value: "/cartesian_command"
      read_only: true
      description: "Topic used by the command manager output publisher."
    max_linear_velocity:
      type: string
      default_value: "/explorer_user_interfaces/rqt_armcontrol/max_linear_speed"
      read_only: true
      description: "std_msgs/Float64 topic that changes the downstream linear speed live. Keeps command_scale in sync. Empty disables it."
    max_angular_velocity:
      type: string
      default_value: "/explorer_user_interfaces/rqt_armcontrol/max_angular_speed"
      read_only: true
      description: "std_msgs/Float64 topic that changes the downstream angular speed live. Keeps command_scale in sync. Empty disables it."
    shared_control_goals:
      type: string
      default_value: "/shared_control/goals"
      read_only: true
      description: "geometry_msgs/PoseArray holding the current shared-control goals, in frames.base_frame. Each message replaces the previous set."
    shared_control_confidences:
      type: string
      default_value: "/shared_control/confidences"
      read_only: true
      description: "Float64MultiArray of goal confidences while shared control is active. The dimension label lists the goal ids, comma-separated."
    shared_control_soft_goal:
      type: string
      default_value: "/shared_control/soft_goal"
      read_only: true
      description: "Confidence-weighted goal pose while shared control is active."

  command_scale:
    max_linear_velocity:
      type: double
      default_value: 0.1
      description: "Linear speed in m/s a unit command reaches downstream. Match qontrol command_max_linear_velocity."
    max_angular_velocity:
      type: double
      default_value: 0.2
      description: "Angular speed in rad/s a unit command reaches downstream. Match qontrol command_max_angular_velocity."

  inputs:
    sources:
      type: string_array
      default_value: ["joystick", "tablet", "visual_servoing"]
      read_only: true
      description: "Declared input sources. Supported values: joystick, tablet, visual_servoing."
    joystick:
      timeout_sec:
        type: double
        default_value: 0.2
        description: "Maximum joystick command age before it is ignored."
      enabled:
        type: bool
        default_value: true
        description: "Whether joystick input is enabled at startup."
    tablet:
      timeout_sec:
        type: double
        default_value: 0.2
        description: "Maximum tablet command age before it is ignored."
      enabled:
        type: bool
        default_value: true
        description: "Whether tablet input is enabled at startup."
    visual_servoing:
      timeout_sec:
        type: double
        default_value: 0.2
        description: "Maximum visual-servoing command age before it is ignored."
      enabled:
        type: bool
        default_value: true
        description: "Whether visual-servoing input is enabled at startup."

  shapers:
    jaco:
      min_radius:
        type: double
        default_value: 0.05
        description: "Minimum XY radius used before Jaco angular velocity generation is disabled."
      max_angular_velocity:
        type: double
        default_value: 0.4
        description: "Maximum absolute angular.z generated by the Jaco geometric shaper."
    snake:
      gain:
        type: double
        default_value: 3.0
        description: "Scaling applied to tool_z_axis cross linear_velocity in snake mode."

  rate_limiter:
    max_linear_acceleration:
      type: double
      default_value: 2.0
      description: "Maximum rate of change of normalized linear velocity command per second (<= 0.0 to disable)."
    max_angular_acceleration:
      type: double
      default_value: 2.0
      description: "Maximum rate of change of normalized angular velocity command per second (<= 0.0 to disable)."

  behaviours:
    joint_targets:
      joint_names:
        type: string_array
        default_value: [""]
        read_only: true
        description: "Joint names used by joint-target behaviours. Order must match the Jacobian columns."
      target_names:
        type: string_array
        default_value: ["home"]
        read_only: true
        description: "Names for configured joint-space targets."
      positions:
        type: double_array
        default_value: [0.0]
        read_only: true
        description: "Flattened target joint positions, in target_names order. Each target has joint_names.size() positions."

    pose_targets:
      target_names:
        type: string_array
        default_value: [""]
        read_only: true
        description: "Names for Cartesian pose targets."
      frame_ids:
        type: string_array
        default_value: [""]
        read_only: true
        description: "Reference frame for each pose target, in target_names order. Every entry must match frames.base_frame."
      positions:
        type: double_array
        default_value: [0.0, 0.0, 0.0]
        read_only: true
        description: "Flattened XYZ positions, three values per pose target."
      orientations:
        type: double_array
        default_value: [0.0, 0.0, 0.0, 1.0]
        read_only: true
        description: "Flattened XYZW quaternions, four values per pose target."
      linear_kp:
        type: double
        default_value: 1.0
      angular_kp:
        type: double
        default_value: 1.0
      max_linear_velocity:
        type: double
        default_value: 0.1
      max_angular_velocity:
        type: double
        default_value: 0.2
      position_tolerance:
        type: double
        default_value: 0.05
      orientation_tolerance:
        type: double
        default_value: 0.05

    shared_control:
      goal_names:
        type: string_array
        default_value: [""]
        read_only: true
        description: "Names of static goals. Dynamic goals arrive on topics.shared_control_goals."
      positions:
        type: double_array
        default_value: [0.0, 0.0, 0.0]
        read_only: true
        description: "Flattened XYZ positions in frames.base_frame, three values per goal."
      orientations:
        type: double_array
        default_value: [0.0, 0.0, 0.0, 1.0]
        read_only: true
        description: "Flattened XYZW quaternions, four values per goal."
      alpha_conf:
        type: double
        default_value: 1.5
        description: "Confidence integration gain in 1/s."
      theta_l_deg:
        type: double
        default_value: 15.0
        description: "Half-angle of the cone around a goal direction inside which its confidence rises, in degrees."
      v_j_max:
        type: double
        default_value: 0.055
        description: "Commanded speed in m/s at which confidences integrate at full rate."
      gamma:
        type: double
        default_value: 2.0
        description: "Gain on the goal-aligned velocity component when assistance is full."
      r1:
        type: double
        default_value: 0.04
        description: "Distance gate radius in m. Assistance ramps from the smaller of r1 and r2 to the larger."
      r2:
        type: double
        default_value: 0.02
        description: "Distance gate radius in m. Confidences freeze inside the smaller of r1 and r2 around any goal."
      theta1_deg:
        type: double
        default_value: 15.0
        description: "Orientation error in degrees above which rotation assistance is full."
      theta2_deg:
        type: double
        default_value: 5.0
        description: "Orientation error in degrees below which rotation assistance is off."
      goal_match_distance:
        type: double
        default_value: 0.05
        description: "A goal within this distance in m of a goal from the previous set keeps its confidence."
      input_scale:
        type: double
        default_value: 1.0
        description: "Scale on the operator command inside shared control, in (0, 1]. Below 1 leaves headroom for gamma under the downstream max speed; 1/gamma reproduces the FR3 setup."
